<svg viewBox="0 0 960 696" width="960" height="696" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
  <title id="t">corp-new skill: a new HQ department</title>
  <desc id="d">The core is the two-way link: the HQ department map has the line "Sales: ../corp-sales", the first line of the department AGENTS.md is "A department of HQ ../hq". Steps: 1 find the HQ (a folder with me.md or stack/harness.md); 2 no HQ — install it from agent-starter; 3 a corp-domain name with no folder or map entry yet; 4 department skeleton: AGENTS.md with placeholders, CLAUDE.md and .claude/skills symlinks, tasks/, git init; 5 a private GitHub repository only if you ask for it; 6 link with the HQ in the rules on each side; 7 a ✓/✗ report and what to fill in next.</desc>
  <defs>
    <marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#e11d74"/></marker>
  </defs>
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,Menlo,Monaco,Consolas,'Liberation Mono',monospace}
  </style>

  <rect width="960" height="696" rx="14" fill="#f8fafc"/>

  <!-- Core -->
  <text x="24" y="52" class="s" fill="#0f172a" font-size="27" font-weight="700">The department knows its HQ, the HQ knows its departments</text>

  <!-- HQ -->
  <rect x="24" y="80" width="300" height="208" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="118" class="m" fill="#0f172a" font-size="24" font-weight="700">hq/</text>
  <text x="308" y="117" class="s" fill="#64748b" font-size="18" text-anchor="end">HQ</text>
  <g class="m" font-size="17" fill="#0f172a">
    <rect x="40" y="136" width="268" height="40" rx="5" fill="#f1f5f9"/>
    <text x="52" y="162">AGENTS.md</text>
    <text x="298" y="162" class="s" fill="#64748b" font-size="15" text-anchor="end">department map</text>
    <path d="M 50,176 V 204 H 60" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="184" width="248" height="40" rx="5" fill="#fdf0f6" stroke="#e11d74" stroke-width="1.6"/>
    <text x="72" y="210">Sales: ../corp-sales</text>
    <rect x="40" y="232" width="268" height="40" rx="5" fill="#f1f5f9"/>
    <text x="52" y="258">me.md</text>
  </g>

  <!-- Department -->
  <rect x="536" y="80" width="400" height="304" rx="8" fill="#ffffff" stroke="#e11d74" stroke-width="1.2"/>
  <text x="552" y="118" class="m" fill="#0f172a" font-size="24" font-weight="700">corp-sales/</text>
  <text x="920" y="117" class="s" fill="#e11d74" font-size="18" font-weight="600" text-anchor="end">new department</text>
  <g class="m" font-size="17" fill="#0f172a">
    <rect x="552" y="136" width="368" height="40" rx="5" fill="#f1f5f9"/>
    <text x="564" y="162">AGENTS.md</text>
    <text x="910" y="162" class="s" fill="#64748b" font-size="15" text-anchor="end">department rules</text>
    <path d="M 562,176 V 204 H 572" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="572" y="184" width="348" height="40" rx="5" fill="#fdf0f6" stroke="#e11d74" stroke-width="1.6"/>
    <text x="584" y="210">A department of HQ ../hq</text>
    <rect x="552" y="232" width="368" height="40" rx="5" fill="#f1f5f9"/>
    <text x="564" y="258">CLAUDE.md → AGENTS.md</text>
    <text x="910" y="258" class="s" fill="#64748b" font-size="15" text-anchor="end">symlink</text>
    <rect x="552" y="280" width="368" height="40" rx="5" fill="#f1f5f9"/>
    <text x="564" y="306">.claude/skills → .agents/skills</text>
    <rect x="552" y="328" width="368" height="40" rx="5" fill="#f1f5f9"/>
    <text x="564" y="354">tasks/</text>
  </g>

  <!-- Link -->
  <text x="430" y="172" class="s" fill="#e11d74" font-size="18" font-weight="700" text-anchor="middle">6 · link in the rules</text>
  <path d="M 308,197 H 570" fill="none" stroke="#e11d74" stroke-width="2.6" marker-end="url(#ap)"/>
  <path d="M 572,213 H 310" fill="none" stroke="#e11d74" stroke-width="2.6" marker-end="url(#ap)"/>

  <!-- Steps (numbers as in SKILL.md) -->
  <g class="s" font-size="20">
    <g fill="#94a3b8" font-weight="700" text-anchor="end">
      <text x="44" y="440">1</text>
      <text x="44" y="478">2</text>
      <text x="44" y="516">3</text>
      <text x="44" y="554">4</text>
      <text x="44" y="592">5</text>
      <text x="44" y="630" fill="#e11d74">6</text>
      <text x="44" y="668">7</text>
    </g>
    <g fill="#0f172a" font-weight="700">
      <text x="60" y="440">Find the HQ</text>
      <text x="60" y="478">No HQ</text>
      <text x="60" y="516">Name corp-&lt;domain&gt;</text>
      <text x="60" y="554">Skeleton</text>
      <text x="60" y="592" fill="#64748b">GitHub</text>
      <text x="60" y="630" fill="#e11d74">Link to the HQ</text>
      <text x="60" y="668">Report</text>
    </g>
    <g fill="#475569" font-size="19">
      <text x="306" y="440">a folder with <tspan class="m">me.md</tspan> or <tspan class="m">stack/harness.md</tspan></text>
      <text x="306" y="478">install it from agent-starter</text>
      <text x="306" y="516">no folder and no entry in the department map yet</text>
      <text x="306" y="554"><tspan class="m">AGENTS.md</tspan> with placeholders, <tspan class="m">git init</tspan></text>
      <text x="306" y="592" fill="#64748b">private repository, only if you ask for it</text>
      <text x="306" y="630" fill="#e11d74">a line in the rules on each side ↑</text>
      <text x="306" y="668">✓/✗ table and what to fill in next</text>
    </g>
  </g>
</svg>
